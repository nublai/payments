name: forge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  forge:
    name: forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        # Default profile (via_ir false, 500 runs). Tests compile the contracts
        # they execute; they do not deploy release bytecode.
        run: bun run --cwd packages/contracts test -- --ffi

      - name: Check release runtime size
        # Release profile only. Fails if Account or the other deployed contracts
        # exceed the 24,576-byte EIP-170 runtime limit.
        working-directory: packages/contracts
        run: ./scripts/sh/check-runtime-size.sh
