name: forge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  forge:
    name: forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        # Release profile (via_ir, 200 optimizer runs). This is the only
        # forge build in this job, so out/ is not a default-profile artifact.
        working-directory: packages/contracts
        run: FOUNDRY_PROFILE=release forge test --ffi

      - name: Check release runtime size
        # Fails if Account runtime exceeds 24,576 bytes. The log prints the
        # Account size and the bytes of headroom under that limit.
        working-directory: packages/contracts
        run: ./scripts/sh/check-runtime-size.sh

      - name: Release follow-up checks
        working-directory: packages/contracts
        run: ./scripts/sh/test-release-followups.sh

      - name: Relayer mnemonic checks
        working-directory: packages/contracts
        run: ./scripts/sh/test-relayer-mnemonic.sh
