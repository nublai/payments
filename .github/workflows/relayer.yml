name: relayer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  relayer:
    name: relayer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Package exports point at gitignored dist/. test:run imports those files.
      # The paid-upgrade anvil script in test:run needs anvil, cast, and forge.
      - name: Build contracts package
        run: bun run --cwd packages/contracts build

      - name: Test
        run: bun run --cwd packages/relayer test:run
