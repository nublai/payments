name: wallet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wallet:
    name: wallet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # passkey-flow.test.ts spawns this absolute path; it is not read from PATH.
      - name: Link anvil for the passkey test
        run: |
          dest=/home/box/.foundry/versions/foundry-rs/foundry/v1.8.4/anvil
          sudo mkdir -p "$(dirname "$dest")"
          sudo ln -sfn "$(command -v anvil)" "$dest"

      - name: Test
        run: bun run --cwd packages/wallet test
