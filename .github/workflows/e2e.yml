name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-local-payment:
    name: e2e-local-payment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc lsof

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Local payment
        run: bun run e2e:local-payment

  e2e-local-escrow:
    name: e2e-local-escrow
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc lsof

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Local escrow
        run: bun run e2e:local-escrow
