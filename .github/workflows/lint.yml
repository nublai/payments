name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The anti-slop plugin is loaded as .ts and needs Node's native type
      # stripping, which is on by default from 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: Node version
        run: node --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
