<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="168" viewBox="0 0 1080 168" role="img" aria-label="Payment flow from an agent through nubl to an EIP-7702 account on Base">
  <title>Agent to account flow</title>
  <rect width="1080" height="168" fill="#fafafa"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#222222"/>
    </marker>
  </defs>
  <g fill="#ffffff" stroke="#222222" stroke-width="1.5">
    <rect x="16" y="36" width="150" height="96" rx="8"/>
    <rect x="190" y="36" width="150" height="96" rx="8"/>
    <rect x="364" y="36" width="150" height="96" rx="8"/>
    <rect x="538" y="36" width="150" height="96" rx="8"/>
    <rect x="712" y="36" width="150" height="96" rx="8"/>
    <rect x="886" y="36" width="178" height="96" rx="8"/>
  </g>
  <g stroke="#222222" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="166" y1="84" x2="186" y2="84"/>
    <line x1="340" y1="84" x2="360" y2="84"/>
    <line x1="514" y1="84" x2="534" y2="84"/>
    <line x1="688" y1="84" x2="708" y2="84"/>
    <line x1="862" y1="84" x2="882" y2="84"/>
  </g>
  <g fill="#111111" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="91" y="74" font-size="16" font-weight="600">Agent</text>
    <text x="91" y="98" font-size="12">LLM / MCP client</text>
    <text x="265" y="70" font-size="16" font-weight="600">nubl</text>
    <text x="265" y="92" font-size="12">CLI / MCP</text>
    <text x="265" y="108" font-size="12">local keys, limits</text>
    <text x="439" y="70" font-size="15" font-weight="600">Signed intent</text>
    <text x="439" y="98" font-size="12">EIP-712</text>
    <text x="613" y="70" font-size="16" font-weight="600">Relayer</text>
    <text x="613" y="92" font-size="12">Cloudflare Worker</text>
    <text x="613" y="108" font-size="12">pays gas</text>
    <text x="787" y="84" font-size="15" font-weight="600">Orchestrator</text>
    <text x="975" y="74" font-size="15" font-weight="600">Account</text>
    <text x="975" y="98" font-size="12">EIP-7702 on Base</text>
