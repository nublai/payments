name = "relayer-worker"
main = "src/index.ts"
# Account comes from `wrangler login` or CLOUDFLARE_ACCOUNT_ID. Do not commit an account id.
compatibility_date = "2025-06-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 0.5

[observability.logs]
enabled = true

# Migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignerDO", "SignerPoolDO", "IntentNonceDO", "BundleStatusDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HttpAuthNonceDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WalletBindingDO"]

# Local Development
# Public OIDC config (not secrets). Leave OIDC_ENABLED unset until issuer, JWKS
# URL, and client id are all set. Example, not applied:
# OIDC_ENABLED = "true"
# OIDC_ISSUER = "https://auth.example.com"
# OIDC_JWKS_URL = "https://auth.example.com/oauth2/jwks"
# OIDC_CLIENT_ID = "client_example"
# OIDC_WALLETS_CLAIM_ENABLED = "true"
# OIDC_WALLETS_CLAIM = "wallets"
# Stage and prod set PRIVY_ENABLED explicitly. Unset still means on in code.
# Set PRIVY_ENABLED = "false" for OIDC-only.
# PAID_UPGRADE_ENABLED is unset in every env, so the USDC-paid first upgrade
# (wallet_prepareCalls accountUpgrade) is off. Launch is sponsored-only. Only
# the exact string "true" turns it on. Example, not applied:
# PAID_UPGRADE_ENABLED = "true"
[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[[queues.producers]]
queue = "relayer-monitor-queue-local"
binding = "MONITOR_QUEUE"

[[queues.consumers]]
queue = "relayer-monitor-queue-local"
max_batch_size = 16
max_retries = 30

[durable_objects]
bindings = [
  { name = "SIGNER", class_name = "SignerDO" },
  { name = "SIGNER_POOL", class_name = "SignerPoolDO" },
  { name = "INTENT_NONCE_MANAGER", class_name = "IntentNonceDO" },
  { name = "BUNDLE_STATUS_DO", class_name = "BundleStatusDO" },
  { name = "HTTP_AUTH_NONCE_MANAGER", class_name = "HttpAuthNonceDO" },
  { name = "WALLET_BINDING", class_name = "WalletBindingDO" }
]

# Stage
# No custom_domain route is committed. Wrangler does not substitute env vars into
# custom_domain routes. After `wrangler deploy --env stage`, attach the public
# hostname in the Cloudflare dashboard (Workers → this worker → Domains).
# Point the wallet at that origin with RELAYER_URL_STAGE.
[env.stage]
# FEE_RECIPIENT is required. Startup refuses the worker when it is missing or
# the zero address. Set it before deploy:
#   wrangler secret put FEE_RECIPIENT --env stage
# Do not commit the address.
# PRIVY_ENABLED is set explicitly. Startup then requires PRIVY_APP_ID and
# PRIVY_APP_SECRET. Set the var to "false" when those secrets are not ready.
# ERC8128_ENABLED lets `tw account create` / `tw account delegate` sign the
# sponsored upgrade with the new account's own key, without the allowlist.
vars = { NODE_ENV = "production", PRIVY_ENABLED = "true", ERC8128_ENABLED = "true" }
preview_urls = false

[env.stage.observability]
enabled = true
head_sampling_rate = 0.5

[env.stage.observability.logs]
invocation_logs = true

[env.stage.durable_objects]
bindings = [
  { name = "SIGNER", class_name = "SignerDO" },
  { name = "SIGNER_POOL", class_name = "SignerPoolDO" },
  { name = "INTENT_NONCE_MANAGER", class_name = "IntentNonceDO" },
  { name = "BUNDLE_STATUS_DO", class_name = "BundleStatusDO" },
  { name = "HTTP_AUTH_NONCE_MANAGER", class_name = "HttpAuthNonceDO" },
  { name = "WALLET_BINDING", class_name = "WalletBindingDO" }
]

[[env.stage.queues.producers]]
queue = "relayer-monitor-queue-stage"
binding = "MONITOR_QUEUE"

[[env.stage.queues.consumers]]
queue = "relayer-monitor-queue-stage"
max_batch_size = 10
max_retries = 30

[env.stage.triggers]
crons = ["*/5 * * * *"]

# Prod
# Same as stage: set the hostname in the Cloudflare dashboard, then RELAYER_URL_PROD.
[env.prod]
# FEE_RECIPIENT is required. Startup refuses the worker when it is missing or
# the zero address. Set it before deploy:
#   wrangler secret put FEE_RECIPIENT --env prod
# Do not commit the address.
# PRIVY_ENABLED is set explicitly. Startup then requires PRIVY_APP_ID and
# PRIVY_APP_SECRET. Set the var to "false" when those secrets are not ready.
# ERC8128_ENABLED lets `tw account create` / `tw account delegate` sign the
# sponsored upgrade with the new account's own key, without the allowlist.
vars = { NODE_ENV = "production", PRIVY_ENABLED = "true", ERC8128_ENABLED = "true" }
preview_urls = false

[env.prod.observability]
enabled = true
head_sampling_rate = 0.5

[env.prod.observability.logs]
invocation_logs = true

[env.prod.durable_objects]
bindings = [
  { name = "SIGNER", class_name = "SignerDO" },
  { name = "SIGNER_POOL", class_name = "SignerPoolDO" },
  { name = "INTENT_NONCE_MANAGER", class_name = "IntentNonceDO" },
  { name = "BUNDLE_STATUS_DO", class_name = "BundleStatusDO" },
  { name = "HTTP_AUTH_NONCE_MANAGER", class_name = "HttpAuthNonceDO" },
  { name = "WALLET_BINDING", class_name = "WalletBindingDO" }
]

[[env.prod.queues.producers]]
queue = "relayer-monitor-queue-prod"
binding = "MONITOR_QUEUE"

[[env.prod.queues.consumers]]
queue = "relayer-monitor-queue-prod"
max_batch_size = 10
max_retries = 30

[env.prod.triggers]
crons = ["*/5 * * * *"]
