[profile.default]
# Compiler settings
auto_detect_solc = false
solc_version = "0.8.33"
evm_version = "prague"
via_ir = false # Fast compilation for development
optimizer = true
optimizer_runs = 500 # Lower runs = smaller bytecode (needed for TownsAccount <24KB limit)
bytecode_hash = "none"
test = "test"
script = "scripts/sol"
cbor_metadata = false
libs = ["node_modules"]
ignored_error_codes = [1878, 2424, 4591, 8429, 5667, 3860, 5574, 2394]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./deploy" },
  { access = "read", path = "./out" }
] # Configures permissions for cheatcodes that touch the filesystem

# Release profile: use `forge build --profile release` for deployment
[profile.release]
via_ir = true # Full optimization for deployment
optimizer_runs = 200 # Lower runs = smaller bytecode (needed for TownsAccount <24KB limit)

# Test settings
fuzz = { runs = 256 } # The amount of fuzz runs to perform for each fuzz test case.
block_timestamp = 1_680_220_800 # The value of block.timestamp in tests. March 31, 2023 at 00:00 GMT
verbosity = 3 # The verbosity level to use during tests.
ffi = true
fs_permissions = [
  { access = "read", path = "./deploy" },
  { access = "read", path = "./out" }
] # Configures permissions for cheatcodes that touch the filesystem
gas_reports = ["*"] # The contracts to print gas reports for.


[rpc_endpoints]
local = "http://localhost:8545"
local_arb = "http://localhost:8546"
base_sepolia = "${RPC_84532}"
base = "${RPC_8453}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api" }

[lint]
lint_on_build = false
severity = ["high", "med", "low", "gas"]
exclude_lints = ["asm-keccak256", "erc20-unchecked-transfer", "incorrect-shift"]
ignore = ["scripts/**/*", "test/**/*"]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
